<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Simulador Interativo e Gamificado de Contextos Clínicos">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Mudei para default para que o relógio/bateria do iPhone fiquem visíveis num fundo claro -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pharma SOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Tema Azul Profitecla para o topo do browser no Android -->
  <meta name="theme-color" content="#008ad8">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pharma Inc Community</title>
  <link rel="manifest" href="manifest.json">

  <!-- Estilos para forçar a Splash Screen do Flutter Web a arrancar em Branco -->
  <style>
    body {
      background-color: #FFFFFF;
    }
    .flutter-splash-screen {
      background-color: #FFFFFF !important;
    }
  </style>

  <!--
    Captura cedo o evento de instalação do Chrome/Edge (Android), porque
    pode ser disparado antes de o Flutter arrancar. É lido pelo
    pwa_platform_web.dart (window.__pwaDeferredPrompt / window.__pwaInstalled).
  -->
  <script>
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaDeferredPrompt = e;
    });
    window.addEventListener('appinstalled', function () {
      window.__pwaDeferredPrompt = null;
      window.__pwaInstalled = true;
    });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Limpa service workers antigos para forçar a atualização imediata no telemóvel
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
</body>
</html>
